<html>

    <title>California Black Power Book</title>
    <link href="https://fonts.googleapis.com/css?family=Poppins:400,600,700" rel="stylesheet" />
    <link href="/static/css/main.css" rel="stylesheet" />
    <style>
      .home-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 40px;
      }

      .home-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 40px;
        max-width: 1200px;
        width: 100%;
      }

      .home-card {
        background: #ffffff;
        border-radius: 10px;
        padding: 40px 30px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        border: 1px solid #e0e0e0;
        text-decoration: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 250px;
      }

      .home-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      }

      .home-card-icon {
        width: 80px;
        height: 80px;
        margin-bottom: 20px;
        border-radius: 50%;
        background: linear-gradient(135deg, #9c288c 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        color: white;
      }

      .home-card-title {
        font-size: 24px;
        font-weight: bold;
        color: #9c288c;
        margin-bottom: 10px;
        font-family: 'Poppins', Arial, sans-serif;
      }

      .home-card-desc {
        font-size: 14px;
        color: #555;
        line-height: 1.6;
        font-family: Arial, sans-serif;
      }

      .home-card.disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }

      .home-card.disabled:hover {
        transform: none;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      }

      .coming-soon {
        display: inline-block;
        background: #ffd700;
        color: #333;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 600;
        margin-top: 10px;
        font-family: 'Poppins', Arial, sans-serif;
      }

      .page-header {
        position: absolute;
        top: 40px;
        left: 0;
        right: 0;
        text-align: center;
        color: white;
        z-index: 10;
      }

      .page-title {
        font-size: 48px;
        font-weight: 700;
        font-family: 'Poppins', Arial, sans-serif;
        margin: 0;
        text-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
      }
    </style>
  </head>
  <body>
    <div class="page-header">
      <h1 class="page-title">California Black Power Book</h1>
    </div>
    <div class="home-container">
      <div class="home-grid">
        <!-- Location Card -->
        <a href="/location" class="home-card">
          <div class="home-card-icon">
            <svg width="45" height="45" viewBox="0 0 24 24" fill="white">
              <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
            </svg>
          </div>
          <div class="home-card-title">Location</div>
          <div class="home-card-desc">Search and explore elected officials by location, office, and more</div>
        </a>

        <!-- News Card -->
        <a href="/news" class="home-card">
          <div class="home-card-icon">
            <svg width="45" height="45" viewBox="0 0 24 24" fill="white">
              <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/>
            </svg>
          </div>
          <div class="home-card-title">News</div>
          <div class="home-card-desc">Stay updated with the latest news and announcements</div>
        </a>

        <!-- Login Card -->
        <a href="/login" class="home-card">
          <div class="home-card-icon">
            <svg width="45" height="45" viewBox="0 0 24 24" fill="white">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
            </svg>
          </div>
          <div class="home-card-title">Login</div>
          <div class="home-card-desc">Sign in to access admin features and manage content</div>
        </a>
      </div>
    </div>
  </body>
</html>
